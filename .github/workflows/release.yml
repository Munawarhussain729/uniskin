name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Version-PR mode only: opens/updates a "Version Packages" PR that bumps
  # versions and changelogs from pending changesets. Publishing is manual —
  # see docs/releasing.md.
  version-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the version bump branch
      pull-requests: write  # open/update the Version Packages PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
