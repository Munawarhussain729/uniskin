name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushing to a PR branch cancels its superseded run; pushes to main
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default deny; each job opts into the scopes it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm 11 imports node:sqlite, absent on Node 20 — use the bundled
      # standalone binary there. Scripts still run under the runner's
      # Node (20), which is what the matrix measures.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          standalone: ${{ matrix.node == 20 }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-blocking for now: findings land in the job summary and the
      # step is annotated when it fails, but the job stays green.
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod
      - name: Summarize audit findings
        run: |
          pnpm audit --prod --json > "$RUNNER_TEMP/audit.json" || true
          node <<'EOF'
            const fs = require("fs");
            let audit = {};
            try {
              audit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/audit.json", "utf8"));
            } catch {}
            const sev = audit.metadata?.vulnerabilities ?? {};
            const lines = [
              "### `pnpm audit --prod`",
              "",
              "| Severity | Count |",
              "|---|---:|",
              ...["critical", "high", "moderate", "low", "info"].map(s => `| ${s} | ${sev[s] ?? 0} |`),
              "",
              `${audit.metadata?.totalDependencies ?? "?"} dependencies scanned.`,
            ];
            const advisories = Object.values(audit.advisories ?? {});
            if (advisories.length) {
              lines.push("", "| Package | Severity | Finding |", "|---|---|---|");
              for (const a of advisories) lines.push(`| ${a.module_name} | ${a.severity} | ${a.title} |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          EOF
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm --filter site build
      - run: pnpm -r test

  # Runs the playground suite against a Tailwind version matrix to catch
  # breakage in the internals uniskin relies on (the @plugin `this.src`
  # context and how plugin utilities are serialized).
  tailwind-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.tailwind == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        tailwind:
          # Measured floor: ≤4.3.2 emits compound utilities nested rather
          # than as the flat `.ui-x.ui-y` selectors the suite asserts.
          - "4.3.3"
          # The version pinned in apps/playground/package.json.
          - "4.3.5"
          - "latest"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Pin tailwindcss ${{ matrix.tailwind }}
        env:
          TW: ${{ matrix.tailwind }}
        run: |
          # Edits files rather than `pnpm add` (which keeps ^-ranges), and
          # pins @tailwindcss/node + oxide too — cli's internal deps are
          # ^-ranges and would otherwise silently mix in newer internals.
          node -e '
            const fs = require("fs");
            const v = process.env.TW;
            const p = "apps/playground/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.devDependencies["tailwindcss"] = v;
            pkg.devDependencies["@tailwindcss/cli"] = v;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            const w = "pnpm-workspace.yaml";
            const s = fs.readFileSync(w, "utf8");
            if (/^overrides:/m.test(s)) throw new Error("pnpm-workspace.yaml already has overrides");
            fs.writeFileSync(w, s + `\noverrides:\n  "@tailwindcss/node": "${v}"\n  "@tailwindcss/oxide": "${v}"\n`);
          '
          # CI auto-freezes; the pin deliberately rewrites deps/overrides.
          pnpm install --no-frozen-lockfile
      - name: Show resolved Tailwind versions
        run: |
          node -e '
            const { createRequire } = require("module");
            const { join, dirname, resolve } = require("path");
            const { existsSync, realpathSync } = require("fs");
            // resolve through @tailwindcss/cli so transitive @tailwindcss/*
            // internals (siblings in the pnpm store) are found too
            const req = createRequire(realpathSync(resolve("apps/playground/node_modules/@tailwindcss/cli/package.json")));
            const ver = (p) => { let d = dirname(req.resolve(p)); while (!existsSync(join(d, "package.json"))) d = dirname(d); return require(join(d, "package.json")).version; };
            console.log("tailwindcss", ver("tailwindcss"));
            console.log("@tailwindcss/cli", require(resolve("apps/playground/node_modules/@tailwindcss/cli/package.json")).version);
            console.log("@tailwindcss/node", ver("@tailwindcss/node"));
            console.log("@tailwindcss/oxide", ver("@tailwindcss/oxide"));
          '
      - run: pnpm --filter playground test

  install-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Pack publishable packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for pkg in uniskin adapter-shadcn adapter-daisyui; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -la "$RUNNER_TEMP/tarballs"
      - name: Report package sizes
        run: |
          node <<'EOF'
            const { execFileSync } = require("child_process");
            const fs = require("fs");
            const lines = [
              "### `npm pack --dry-run`",
              "",
              "| Package | Files | Tarball | Unpacked |",
              "|---|---:|---:|---:|",
            ];
            const kib = (n) => `${(n / 1024).toFixed(1)} KiB`;
            for (const dir of ["uniskin", "adapter-shadcn", "adapter-daisyui"]) {
              const out = execFileSync("npm", ["pack", "--dry-run", "--json", "--ignore-scripts"], { cwd: `packages/${dir}`, encoding: "utf8" });
              const p = JSON.parse(out)[0];
              lines.push(`| ${p.name}@${p.version} | ${p.entryCount} | ${kib(p.size)} | ${kib(p.unpackedSize)} |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          EOF
      - name: Install tarballs into a fresh project
        run: |
          SCRATCH="$RUNNER_TEMP/uniskin-install-check"
          mkdir -p "$SCRATCH"
          cd "$SCRATCH"
          printf '{"name":"uniskin-install-check","private":true,"type":"module"}\n' > package.json
          pnpm add "$RUNNER_TEMP"/tarballs/*.tgz
          pnpm add -D --ignore-scripts tailwindcss@^4 @tailwindcss/cli@^4
      - name: Compile the README quick-start
        run: |
          SCRATCH="$RUNNER_TEMP/uniskin-install-check"
          cd "$SCRATCH"
          printf '<button class="ui-button ui-primary ui-outline ui-sm">Save</button>\n' > index.html
          for adapter in default shadcn daisyui; do
            printf '@import "tailwindcss";\n@plugin "uniskin" { adapter: "%s"; }\n@source "./index.html";\n' "$adapter" > "input-$adapter.css"
            ./node_modules/.bin/tailwindcss -i "input-$adapter.css" -o "output-$adapter.css"
            grep -q '.ui-button.ui-primary' "output-$adapter.css"
            grep -q '.ui-button.ui-outline' "output-$adapter.css"
          done
