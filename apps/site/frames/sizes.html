<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uniskin — sizes</title>
    <link id="skin" rel="stylesheet" href="/adapters/default.css" />
    <style>
      :root { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.25rem;
        background: var(--ui-surface);
        color: var(--ui-surface-fg);
        font-family: var(--ui-font-sans);
      }
      .f-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
      .f-row:last-child { margin-bottom: 0; }
      .f-tag { min-width: 5.5rem; font-size: 0.75rem; opacity: 0.6; font-family: ui-monospace, monospace; }
    </style>
    <script>
      (() => {
        const q = new URLSearchParams(location.search);
        const adapter = q.get("adapter");
        if (adapter) document.getElementById("skin").href = "/adapters/" + adapter + ".css";
        const dark = q.has("dark")
          ? q.get("dark") === "1" || q.get("dark") === "true"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div class="f-row">
      <span class="f-tag">button</span>
      <button class="ui-button ui-primary ui-sm">sm</button>
      <button class="ui-button ui-primary">md</button>
      <button class="ui-button ui-primary ui-lg">lg</button>
    </div>
    <div class="f-row">
      <span class="f-tag">badge</span>
      <span class="ui-badge ui-success ui-sm">sm</span>
      <span class="ui-badge ui-success">md</span>
      <span class="ui-badge ui-success ui-lg">lg</span>
    </div>
    <div class="f-row">
      <span class="f-tag">input</span>
      <input class="ui-input ui-sm" style="max-width: 8rem" placeholder="sm" aria-label="Small" />
      <input class="ui-input" style="max-width: 10rem" placeholder="md" aria-label="Medium" />
      <input class="ui-input ui-lg" style="max-width: 12rem" placeholder="lg" aria-label="Large" />
    </div>
    <div class="f-row">
      <span class="f-tag">checkbox</span>
      <input type="checkbox" class="ui-checkbox ui-sm ui-primary" checked aria-label="Small" />
      <input type="checkbox" class="ui-checkbox ui-primary" checked aria-label="Medium" />
      <input type="checkbox" class="ui-checkbox ui-lg ui-primary" checked aria-label="Large" />
    </div>
  </body>
</html>
